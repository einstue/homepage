<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        {% if page.title %}
            {{ page.title }} — {{ site.title }}
        {% else %}
            {{ site.title }}
        {% endif %}
    </title>
    <link href="https://cdn.jsdelivr.net/gh/vsalvino/computer-modern@main/fonts/serif.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/gh/vsalvino/computer-modern@main/fonts/typewriter.css" rel="stylesheet">
    <link rel="stylesheet"
          href="{{ '/assets/css/style.css' | relative_url }}">
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']]
            }
        };
    </script>

    <script async
            src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js">
    </script>
</head>

<body>
    <div class="page-shell">
        <header class="site-header">
            <a class="wordmark" href="{{ '/' | relative_url }}">TTN</a>
            <nav aria-label="Main navigation">
                <a href="{{ '/' | relative_url }}" {% if page.url == '/' %}aria-current="page"{% endif %}>Home</a>
                <a href="{{ '/profile/' | relative_url }}" {% if page.url == '/profile/' %}aria-current="page"{% endif %}>Profile</a>
                <a href="{{ '/publications/' | relative_url }}" {% if page.url == '/publications/' %}aria-current="page"{% endif %}>Publications</a>
                <a href="{{ '/documents/' | relative_url }}" {% if page.url == '/documents/' %}aria-current="page"{% endif %}>Writing</a>
                <a href="{{ '/blog/' | relative_url }}" {% if page.url == '/blog/' or page.layout == 'post' %}aria-current="page"{% endif %}>Blog</a>
            </nav>
        </header>

        <main>

            {{ content }}

        </main>

        <footer id="contact">
            <div>
                <p class="footer-name">Tue Tai Nguyen</p>
            </div>
            <div class="footer-links">
                <!-- <a href="mailto:nguyen.tue.tai.e0@s.mail.nagoya-u.ac.jp">Email</a> -->
                <a href="https://github.com/einstue">GitHub</a>
                <a href="profile.html">profile</a>
            </div>
        </footer>
    </div>
</body>

</html>
